plugins {
    id 'java'
    id 'application'
}

group = 'edu.touro.mco152'
version = '1.0'

mainClassName = 'edu.touro.mco152.bm.App'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jfree:jfreechart:1.0.17'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.0.0'
    implementation 'org.eclipse.persistence:eclipselink:3.0.2'
    implementation 'org.apache.derby:derby:10.15.2.0'
    implementation 'org.apache.derby:derbyshared:10.15.2.0'

    // Add this to prevent test errors
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test {
    useJUnitPlatform()
}
//
jar {
    manifest {
        attributes 'Main-Class': mainClassName
    }
    archiveFileName = 'badbm.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
